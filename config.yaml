# Central configuration for the NIDS pipeline.
# Relative paths are resolved against the directory that contains this file.

paths:
  raw_dir: data/raw              # put the CIC-IDS2017 CSV files here
  processed_dir: data/processed  # cleaned dataset + profile (generated)
  models_dir: models             # trained models + metadata (generated)
  reports_dir: reports           # metrics, figures, result tables (generated)

data:
  # Columns that identify a specific host or session instead of describing
  # traffic behaviour. Most only exist in the "GeneratedLabelledFlows" variant
  # of the dataset; columns that are not present are simply ignored.
  drop_columns:
    - Flow ID
    - Source IP
    - Source Port
    - Destination IP
    - Timestamp
    - Fwd Header Length.1        # exact duplicate of "Fwd Header Length"
  drop_duplicates: true
  # Raw label -> attack category. Keys are matched case-insensitively with
  # punctuation ignored, so "Web Attack – XSS" matches "web attack xss".
  category_map:
    benign: Benign
    dos hulk: DoS
    dos goldeneye: DoS
    dos slowloris: DoS
    dos slowhttptest: DoS
    heartbleed: DoS
    ddos: DDoS
    portscan: PortScan
    ftp patator: BruteForce
    ssh patator: BruteForce
    web attack brute force: WebAttack
    web attack xss: WebAttack
    web attack sql injection: WebAttack
    bot: Botnet
    infiltration: Infiltration
  # Size of the per-category sample kept for the dashboard's dataset explorer.
  explorer_sample_per_category: 5000

training:
  random_state: 42
  test_size: 0.2
  # Categories with fewer rows than this are dropped (a stratified split needs
  # at least a few examples of every class).
  min_class_samples: 10
  # Undersampling of the TRAINING split only. The test split keeps the real
  # class distribution, so reported metrics reflect realistic traffic.
  max_train_per_class: 150000
  max_benign_train: 400000
  max_test_rows: null            # null = evaluate on the full test split
  tasks: [binary, multiclass]
  models: [logistic_regression, decision_tree, random_forest, knn, xgboost, mlp]
  selection_metric: f1_macro     # used to pick the "best" model per task

# Hyper-parameters passed straight to each estimator. "max_train_rows" is not
# an estimator argument: it caps the rows used to fit that model (KNN has to
# keep its whole training set in memory and compare every prediction to it).
models:
  logistic_regression:
    max_iter: 500
  decision_tree:
    min_samples_leaf: 1
  random_forest:
    n_estimators: 100
    min_samples_leaf: 2
  knn:
    n_neighbors: 5
    max_train_rows: 50000
  xgboost:
    n_estimators: 200
    max_depth: 8
    learning_rate: 0.1
  mlp:
    hidden_layer_sizes: [128, 64]
    batch_size: 512
    max_iter: 50

live_monitor:
  # Held-out test flows replayed by the dashboard's live monitor.
  stream_rows: 20000

# Research experiments (python -m nids.experiments). Training caps and model
# hyper-parameters are shared with the "training" and "models" sections above.
research:
  models: [xgboost, random_forest]
  # Feature sets compared in every experiment. The destination port is a known
  # shortcut: it names the testbed's targeted service, not the attack's
  # behaviour (D'hooge et al., DIMVA 2022). The TCP initial window sizes depend
  # on each host's operating system, so they may fingerprint the testbed's
  # machines instead of the attack; the third set tests that hypothesis.
  feature_sets:
    all: {label: All features, drop: []}
    no_port: {label: Without destination port, drop: [Destination Port]}
    no_port_window:
      label: Without port and TCP window
      drop: [Destination Port, Init_Win_bytes_forward, Init_Win_bytes_backward]
  primary_feature_set: no_port
  # Day-based split: attacks on the test days never occur on the training days.
  temporal:
    train_days: [Monday, Tuesday, Wednesday]
    test_days: [Thursday, Friday]
    # Benign traffic also changes from day to day. A second set of thresholds is
    # calibrated on recent benign flows from the test days (kept out of the test set).
    recent_calibration_benign: 20000
  # Alarm budget: share of benign flows allowed to raise an alert. Thresholds are
  # set on held-out benign flows (conformal calibration) to stay within it.
  target_fpr: 0.01
  calibration_benign: 50000       # benign flows held out to set thresholds
  anomaly_train_benign: 200000    # benign flows used to fit the anomaly detectors
  max_test_benign: 200000         # benign flows in each test set
  anomaly_detectors:
    isolation_forest:
      n_estimators: 200
    autoencoder:
      hidden_layer_sizes: [32, 8, 32]
      batch_size: 512
      max_iter: 40
  shap_flows_per_category: 2000
